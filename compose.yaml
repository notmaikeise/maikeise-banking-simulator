services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maikeise
      POSTGRES_USER: maikeise
      POSTGRES_PASSWORD: maikeise_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maikeise_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maikeise -d maikeise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  maikeise_db:
